<!-- WORKING ON TEXTS IN DOM -->

<!-- 
- innerText : Gets or sets the text content of an element, not the ones that are hidden or not displayed.
- textContent : Gets or sets the text content of an element and its descendants, with the text of hidden elements included.
- innerHTML : Gets or sets the HTML content of an element, including any HTML tags and their content. 
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="example">
  Hello <span style="display: none;">Secret</span> <strong>World!</strong>
</div>
<script>
    const exampleDiv = document.getElementById('example');

    // Using innerText
    console.log('innerText:', exampleDiv.innerText); // Output: "Hello  World!"

    // Using textContent
    console.log('textContent:', exampleDiv.textContent); // Output: "Hello Secret World!"

    // Using innerHTML
    console.log('innerHTML:', exampleDiv.innerHTML); // Output: "Hello <span style="display: none;">Secret</span> <strong>World!</strong>"
</script>
</body>
</html>
