<!-- WORKING ON NODES IN DOM -->

<!--
- appendChild(): Adds a child node to an element.
- removeChild(): Removes a child node from an element.
- replaceChild(): Replaces a child node with another node.
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>
<script>
    const list = document.getElementById('list');

    // Creating a new list item
    const newItem = document.createElement('li');
    newItem.textContent = 'Item 3';

    // Appending the new item to the list
    list.appendChild(newItem);

    // Removing the first item from the list
    const firstItem = list.firstElementChild;
    list.removeChild(firstItem);

    // Replacing the second item with a new item
    const secondItem = list.children[0]; // After removal, this is now the first item
    const replacementItem = document.createElement('li');
    replacementItem.textContent = 'New Item';
    list.replaceChild(replacementItem, secondItem);
</script>
</body>
</html>
